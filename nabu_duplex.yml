# Onju Voice package for ESPHome >= 2026.11.
#
# - One i2s bus with full_duplex: true at 48 kHz / 32 bit; a resampler microphone feeds
#   micro_wake_word and voice_assistant at 16 kHz / 16 bit. Wake word keeps running during playback.
# - Speaker needs i2s_comm_fmt: stand_msb on the duplex bus (with stand_i2s the amp reads TX one
#   bit late and any volume below 100% becomes loud noise), and a 32 bit chain end to end.
# - Touch thresholds are deltas to the hardware benchmark. Calibrate with touch_setup_mode: "true".
# - Timers ring like on the Voice PE: built-in sound repeated as an announcement over ducked media until
#   stopped by saying "stop", the wake word or the center pad (max 15 min). The top LEDs count down.

substitutions:
  mic_channel: "1" # 0 = left slot, 1 = right slot
  mic_gain: "8" # integer 1..64, applied at 32 bit before conversion to 16 bit (8: speech peaks ~ -11 dBFS on nabu 2)
  noise_suppression_level: "0" # 0..4, done by Home Assistant
  auto_gain: "0dBFS" # 0..31 dBFS, done by Home Assistant
  volume_multiplier: "1.0" # done by Home Assistant
  duck_db: "20"
  touch_setup_mode: "false"
  # nabu 2, 2026-11-19: idle noise up to ~3k, touched +18..22k (left), +11..21k (right), +30..37k (center)
  touch_thresh_left: "8000"
  touch_thresh_center: "12000"
  touch_thresh_right: "7000"
  wakeup_sound_file: https://github.com/s00500/onjuconfig/raw/master/sounds/beep.flac
  error_sound_file: https://github.com/s00500/onjuconfig/raw/master/sounds/error24.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/e2fc10e81071d1f2b7e7674af730c15b8819123f/sounds/timer_finished.flac

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: false
  project:
    name: tetele.onju_voice_satellite
    version: "${project_version}"
  on_boot:
    then:
      - micro_wake_word.disable_model: stop
      - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 100%
          green: 60%
          blue: 0%
      - wait_until:
          condition:
            wifi.connected:
      - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
      - wait_until:
          condition:
            api.connected:
      - light.turn_on:
          id: top_led
          effect: none
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - script.execute: reset_led

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

ota:
  platform: esphome
  password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  encryption:
    key: ${api_key}
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: notification_on
      then:
        - script.execute: turn_on_notification
    - action: notification_clear
      then:
        - script.execute: clear_notification

globals:
  - id: notification
    type: bool
    restore_value: false

# ---------------------------------------------------------------- audio

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO13
    i2s_bclk_pin: GPIO18
    full_duplex: true

microphone:
  # Both onju mics, raw, at the bus rate. Left and right slot = the two mics.
  - platform: i2s_audio
    id: i2s_mics
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO17
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo
    i2s_mode: primary
    correct_dc_offset: true

  # What micro_wake_word and voice_assistant hear: one mic, 16 kHz, 16 bit, with gain.
  - platform: resampler
    id: mic_16k
    microphone:
      microphone: i2s_mics
      channels: ${mic_channel}
      gain_factor: ${mic_gain}
      bits_per_sample: 16
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: onju_out
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO12
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo
    i2s_mode: primary
    buffer_duration: 100ms
    # On the full duplex bus the TX data arrives one bit late at the amp when using stand_i2s: its sign bit
    # becomes the previous sample's LSB, so any software volume < 100% turns into loud noise.
    # stand_msb (no 1-bit delay) realigns it. Verified on nabu2 2026-11-20 (ESPHome 2026.11.0).
    i2s_comm_fmt: stand_msb
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: onju_out
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: 200ms
      - id: media_spk_mixer_input
        timeout: 200ms
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 32
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 32

media_player:
  - platform: speaker
    name: "Media Player"
    id: nabu
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      num_channels: 2
    files:
      - id: wakeup
        file: ${wakeup_sound_file}
      - id: error
        file: ${error_sound_file}
      - id: timer_finished
        file: ${timer_finished_sound_file}
    on_volume:
      - script.execute: show_volume

micro_wake_word:
  id: mww
  models:
    - model: okay_nabu
      id: okay_nabu
    # Only enabled while a timer rings, so "stop" works without the wake word
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  microphone: mic_16k
  stop_after_detection: false
  vad:
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          # "stop" or the wake word while a timer rings only silences it
          - switch.turn_off: timer_ringing
        else:
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: ${duck_db}
              duration: 0.0s
          - media_player.speaker.play_on_device_media_file:
              media_file: wakeup
              announcement: true
          - wait_until:
              condition:
                media_player.is_announcing: nabu
              timeout: 500ms
          - wait_until:
              not:
                media_player.is_announcing: nabu
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic_16k
  media_player: nabu
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: ${noise_suppression_level}
  auto_gain: ${auto_gain}
  volume_multiplier: ${volume_multiplier}
  on_listening:
    - light.turn_on:
        id: top_led
        blue: 100%
        red: 100%
        green: 100%
        brightness: 100%
        effect: listening
  on_stt_vad_end:
    - light.turn_on:
        id: top_led
        blue: 100%
        red: 0%
        green: 20%
        brightness: 70%
        effect: processing
  on_tts_end:
    - light.turn_on:
        id: top_led
        blue: 0%
        red: 20%
        green: 100%
        effect: speaking
  on_end:
    - wait_until:
        not:
          media_player.is_announcing: nabu
    - if:
        condition:
          switch.is_off: timer_ringing
        then:
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 1.0s
    - script.execute: reset_led
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - binary_sensor.is_off: mute_switch
            - not: micro_wake_word.is_running
        then:
          - micro_wake_word.start:
  on_client_connected:
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - binary_sensor.is_off: mute_switch
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_error:
    - media_player.speaker.play_on_device_media_file:
        media_file: error
        announcement: true
    - light.turn_on:
        id: top_led
        blue: 0%
        red: 100%
        green: 0%
        effect: none
    - delay: 1s
    - script.execute: reset_led
  on_timer_started:
    - script.execute: reset_led
  on_timer_cancelled:
    - script.execute: reset_led
  on_timer_finished:
    - switch.turn_on: timer_ringing

# ---------------------------------------------------------------- touch

esp32_touch:
  setup_mode: ${touch_setup_mode}
  # Explicit timing; the driver defaults saturate the pads (value 4194303).
  sleep_duration: 2ms
  measurement_duration: 800us
  low_voltage_reference: 0.8V
  high_voltage_reference: 2.4V
  filter_mode: IIR_16
  debounce_count: 2
  noise_threshold: 0
  jitter_step: 0
  smooth_mode: IIR_2
  denoise_grade: BIT8
  denoise_cap_level: L0

binary_sensor:
  - platform: esp32_touch
    id: volume_down
    name: "Touch volume down"
    internal: true
    pin: GPIO4
    threshold: ${touch_thresh_left}
    on_press:
      then:
        - light.turn_on: left_led
        - script.execute:
            id: set_volume
            volume: -0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_down
            then:
              - script.execute:
                  id: set_volume
                  volume: -0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: left_led

  - platform: esp32_touch
    id: volume_up
    name: "Touch volume up"
    internal: true
    pin: GPIO2
    threshold: ${touch_thresh_right}
    on_press:
      then:
        - light.turn_on: right_led
        - script.execute:
            id: set_volume
            volume: 0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_up
            then:
              - script.execute:
                  id: set_volume
                  volume: 0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: right_led

  - platform: esp32_touch
    id: action
    name: "Touch center"
    internal: true
    pin: GPIO3
    threshold: ${touch_thresh_center}
    on_press:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing

  - platform: gpio
    id: mute_switch
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
    name: Disable wake word
    on_press:
      - script.execute: turn_off_wake_word
    on_release:
      - script.execute: turn_on_wake_word

# ---------------------------------------------------------------- leds

light:
  - platform: esp32_rmt_led_strip
    id: leds
    pin: GPIO11
    chipset: SK6812
    num_leds: 6
    channel_colors: GRB
    default_transition_length: 0s
    gamma_correct: 2.8
  - platform: partition
    id: left_led
    segments:
      - id: leds
        from: 0
        to: 0
    default_transition_length: 100ms
  - platform: partition
    id: top_led
    segments:
      - id: leds
        from: 1
        to: 4
    default_transition_length: 100ms
    effects:
      - pulse:
          name: pulse
          transition_length: 250ms
          update_interval: 250ms
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s
      - addressable_twinkle:
          name: listening_ww
          twinkle_probability: ${twinkle_probability}
      - addressable_twinkle:
          name: listening
          twinkle_probability: 45%
      - addressable_scan:
          name: processing
          move_interval: 80ms
      - addressable_flicker:
          name: speaking
          intensity: 35%
      - addressable_random_twinkle:
          name: random_twinkle
      # Time left of the timer that ends first, as a bar over the 4 top LEDs
      - addressable_lambda:
          name: timer_tick
          update_interval: 250ms
          lambda: |-
            const voice_assistant::Timer *t = nullptr;
            for (const auto &timer : id(va).get_timers()) {
              if (timer.is_active && (t == nullptr || timer.seconds_left < t->seconds_left))
                t = &timer;
            }
            if (t == nullptr) {
              it.all() = Color::BLACK;
              return;
            }
            const float ratio = it.size() * (float) t->seconds_left / (float) std::max<uint32_t>(t->total_seconds, 1);
            for (int i = 0; i < it.size(); i++) {
              const float level = std::clamp(ratio - i, 0.0f, 1.0f);
              it[i] = current_color * (uint8_t) (255 * std::max(level, 0.08f));
            }
      - addressable_lambda:
          name: show_volume
          update_interval: 50ms
          lambda: |-
            int int_volume = int(id(nabu).volume * 100.0f * it.size());
            int full_leds = int_volume / 100;
            int last_brightness = int_volume % 100;
            int i = 0;
            for(; i < full_leds; i++) {
              it[i] = Color::WHITE;
            }
            if(i < 4) {
              it[i++] = Color(64, 64, 64).fade_to_white(last_brightness*256/100);
            }
            for(; i < it.size(); i++) {
              it[i] = Color(64, 64, 64);
            }
  - platform: partition
    id: right_led
    segments:
      - id: leds
        from: 5
        to: 5
    default_transition_length: 100ms

script:
  - id: set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - media_player.volume_set:
          id: nabu
          volume: !lambda return clamp(id(nabu).volume+volume, 0.0f, 1.0f);

  - id: reset_led
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - light.turn_on:
                id: top_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 100%
                effect: pulse
          else:
            - script.execute: reset_led_idle

  - id: reset_led_idle
    then:
      - if:
          condition:
            - lambda: return id(notification);
          then:
            - light.turn_on:
                id: top_led
                blue: 100%
                red: 100%
                green: 0%
                brightness: 100%
                effect: slow_pulse
          else:
            - if:
                condition:
                  and:
                    - switch.is_on: use_wake_word
                    - binary_sensor.is_off: mute_switch
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 100%
                      red: 100%
                      green: 0%
                      brightness: 60%
                      effect: listening_ww
                else:
                  - light.turn_off: top_led
      - if:
          condition:
            lambda: |-
              for (const auto &timer : id(va).get_timers())
                if (timer.is_active) return true;
              return false;
          then:
            - light.turn_on:
                id: top_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 60%
                effect: timer_tick

  - id: show_volume
    mode: restart
    then:
      - light.turn_on:
          id: top_led
          effect: show_volume
      - delay: 1s
      - script.execute: reset_led

  - id: turn_on_notification
    then:
      - lambda: id(notification) = true;
      - script.execute: reset_led

  - id: clear_notification
    then:
      - lambda: id(notification) = false;
      - script.execute: reset_led

  - id: turn_on_wake_word
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: mute_switch
              - switch.is_on: use_wake_word
          then:
            - micro_wake_word.start
            - script.execute: reset_led
          else:
            - logger.log:
                tag: "turn_on_wake_word"
                format: "Trying to start listening for wake word, but %s"
                args:
                  [
                    'id(mute_switch).state ? "mute switch is on" : "use wake word toggle is off"',
                  ]
                level: "INFO"

  - id: turn_off_wake_word
    then:
      - micro_wake_word.stop
      - script.execute: reset_led

  # Stops a forgotten timer after 15 minutes
  - id: timer_ring_timeout
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: timer_ringing

switch:
  - platform: template
    name: Use Wake Word
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: turn_on_wake_word
    on_turn_off:
      - script.execute: turn_off_wake_word
  # On while a finished timer rings
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: ${duck_db}
          duration: 0.0s
      - micro_wake_word.enable_model: stop
      - media_player.repeat_one:
          id: nabu
          announcement: true
      - lambda: id(nabu).set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished
          announcement: true
      - script.execute: reset_led
      - script.execute: timer_ring_timeout
    on_turn_off:
      - script.stop: timer_ring_timeout
      - micro_wake_word.disable_model: stop
      - media_player.repeat_off:
          id: nabu
          announcement: true
      - lambda: id(nabu).set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      - if:
          condition:
            media_player.is_announcing: nabu
          then:
            - media_player.stop:
                id: nabu
                announcement: true
      - if:
          condition:
            not: voice_assistant.is_running
          then:
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input
                decibel_reduction: 0
                duration: 1.0s
      - script.execute: reset_led
  - platform: gpio
    id: dac_mute
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: True
